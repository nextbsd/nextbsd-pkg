name: Build NextBSD packages

# Assembles versioned pkg(8) packages from the component repos' `continuous`
# artifacts and publishes a FLAT pkg repository to per-arch release tags
# (continuous-amd64 / continuous-arm64). pkg(8) only runs on FreeBSD, so the
# packaging happens inside a FreeBSD VM (vmactions); the Linux runner does the
# cross-repo downloads (public repos -> GITHUB_TOKEN) and the release upload.
#
# Trigger model (maintainer decision): PUBLISHING IS MANUAL. workflow_dispatch is
# the only way to build and publish, and no other repository can start this one.
#
# It used to accept repository_dispatch from nextbsd-userland's publish
# (userland-updated) and from nextbsd-contrib's (contrib-updated). Both are gone.
# This workflow assembles the repository that consumers install from, so an
# automatic rebuild republishes whatever just merged upstream before anyone has
# looked at it -- it propagates a problem rather than containing it. A person
# decides when the components are good enough to publish.
#
# pull_request builds the packages but never publishes, so the packaging itself
# is still exercised on every change here.
#
# Both arches ship base + kernel + userland + contrib + kernel-extensions (the
# FreeBSD kexts) + kernel-extensions-graphics, plus the
# display server stack (displayserver-support, xlibs, mesa, xlibre) and the E24
# packages (gnustep-, printing-support, toolchain). The kext sets
# differ (arm64 has no Intel/AMD/Radeon/NVIDIA/Bochs/VBox parts, and ships the
# drm core + the virtio-gpu trio instead), so the graphics asset is per-arch;
# build.sh still skips the package entirely when an arch has no kexts at all.
# amd64 also ships NextBSD-kernel-extensions-nvidia, from its own repo.
# Every kext must carry the packaged kernel's KERNEL-BUILD-ID, or the whole run
# fails before anything is packaged into the repo (pkg#12).

on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/**', 'manifests/**', '.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Download component artifacts (${{ matrix.arch }}, public repos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p art
          gh release download continuous -R nextbsd/nextbsd-freebsd-compat \
            --pattern "nextbsd-base-${ARCH}.tar.gz" --dir art --clobber
          gh release download continuous -R nextbsd/nextbsd-kernel \
            --pattern "nextbsd-kernel-${ARCH}.tar.gz" --dir art --clobber
          gh release download continuous -R nextbsd/nextbsd-userland \
            --pattern "nextbsd-userland-${ARCH}.tar.gz" --dir art --clobber
          # The rest are one artifact per repo, nextbsd-<repo>-<arch>.tar.gz,
          # each packaged as NextBSD-<repo> by build.sh's repkg. Adding a repo
          # is one word here and one repkg call there.
          #   contrib: third-party base programs (sudo, zsh, pico).
          #   displayserver-support, xlibs, mesa, xlibre: the display server
          #     stack (E23 nextbsd#561, E25 nextbsd#583).
          #   gnustep-support, printing-support, toolchain: E24 (nextbsd#574),
          #     what GNUstep needs plus the on-machine toolchain. Gershwin
          #     builds GNUstep itself (D10). nextbsd-gershwin-support is
          #     deliberately not packaged (maintainer, 2026-10-25).
          # None of the display or E24 packages is in NextBSD-everything.
          for r in contrib \
                   displayserver-support xlibs mesa xlibre \
                   gnustep-support printing-support toolchain; do
            gh release download continuous -R "nextbsd/nextbsd-$r" \
              --pattern "nextbsd-$r-${ARCH}.tar.gz" --dir art --clobber
          done
          # nextbsd-mesa publishes a second artifact, Mesa's X parts (GLX, the
          # x11 EGL vendor, libglvnd's libGL/libGLX; nextbsd-mesa#10), packaged
          # as NextBSD-mesa-x11.
          gh release download continuous -R nextbsd/nextbsd-mesa \
            --pattern "nextbsd-mesa-x11-${ARCH}.tar.gz" --dir art --clobber
          # NextBSD's own pkg (pkg#19), built by nextbsd-contrib in its own
          # artifact: packaged as `pkg` for this arch, and the amd64 build's
          # pkg-static (in art/tool/) is what build.sh runs on the amd64 VM
          # for pkg create and pkg repo, whichever arch is being packaged.
          gh release download continuous -R nextbsd/nextbsd-contrib \
            --pattern "nextbsd-contrib-pkg-${ARCH}.tar.gz" --dir art --clobber
          mkdir -p art/tool
          gh release download continuous -R nextbsd/nextbsd-contrib \
            --pattern "nextbsd-contrib-pkg-amd64.tar.gz" --dir art/tool --clobber
          # Graphics kexts are per-arch: BOTH arches ship a stack (amd64 the
          # drm core + Intel/AMD/Radeon/Bochs/VBox, arm64 the drm core + the
          # virtio-gpu trio), under the same bundle names — hence the -${ARCH}
          # suffix (nextbsd-kernel-extensions-graphics#36). The repo was
          # nextbsd-kernel-extensions (nextbsd/nextbsd#551). Every asset must be
          # there: a missing one fails the run (nextbsd/nextbsd#552).
          gh release download continuous -R nextbsd/nextbsd-kernel-extensions-graphics \
            --pattern "graphics-kexts-${ARCH}.tar.gz" --dir art --clobber
          # The FreeBSD kexts come from nextbsd-kernel-extensions
          # (nextbsd/nextbsd#554), per arch, and are packaged as
          # NextBSD-kernel-extensions (pkg#24). Like NVIDIA, they land in their
          # own directory, out of the graphics glob.
          gh release download continuous -R nextbsd/nextbsd-kernel-extensions \
            --pattern "freebsd-kexts-${ARCH}.tar.gz" --dir art/freebsd --clobber
          if [ "$ARCH" = amd64 ]; then
            # NVIDIA comes from its own repo (E21 D3, nextbsd/nextbsd#547) and is
            # packaged on its own as NextBSD-kernel-extensions-nvidia (pkg#22).
            # It lands in art/nvidia/, out of build.sh's art/*kext*.tar.gz glob,
            # so it isn't also packaged into NextBSD-kernel-extensions-graphics.
            gh release download continuous -R nextbsd/nextbsd-kernel-extensions-nvidia \
              --pattern 'nvidia-kexts-amd64.tar.gz' --dir art/nvidia --clobber
          fi
          ls -lh art/

      - name: Build packages + flat repo, then install-test (FreeBSD VM)
        uses: vmactions/freebsd-vm@v1
        with:
          # FreeBSD 15.1 so the VM's native pkg ABI is FreeBSD:15 — matching the
          # packages, which lets install-test.sh's `pkg -r ... update/install`
          # accept the repo (a 14.x VM rejects FreeBSD:15 packages as "wrong
          # architecture" even with ABI pinned). This is the same release the ISO
          # builders (nextbsd/build.sh, gershwin-on-nextbsd) use. pkg create/repo
          # in build.sh are version-agnostic, so packaging is unaffected.
          release: "15.1"
          usesh: true
          copyback: true
          prepare: pkg bootstrap -y || true
          run: |
            set -e
            # build.sh assembles the flat repo and runs Layer A (check-ownership.sh)
            # before cataloging. install-test.sh is Layer B: it really installs
            # NextBSD-everything into a scratch root here, BEFORE the publish step
            # below, so a repo that can't install itself fails CI instead of
            # shipping (nextbsd#370). Both run on PRs too (publish does not).
            ARCH=${{ matrix.arch }} sh scripts/build.sh
            ARCH=${{ matrix.arch }} sh scripts/install-test.sh
            # copyback rsyncs the whole work dir back to the runner, and only
            # out/repo is needed (publish). The staged trees and artifacts are
            # ~2.5 GB with the display and E24 packages, and that transfer has
            # been dropping mid-way; leave only out/repo to copy back.
            rm -rf stage tool art

      - name: Publish flat repo to continuous-${{ matrix.arch }}
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: continuous-${{ matrix.arch }}
        run: |
          R=nextbsd/nextbsd-pkg
          gh release view "$TAG" -R "$R" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$R" \
                 --prerelease --title "NextBSD packages — ${{ matrix.arch }} (rolling)" \
                 --notes "Flat pkg(8) repository. Configure pkg with a NextBSD.conf pointing at this tag's download URL."
          # Safe publish order so a concurrent `pkg update` never sees a broken repo,
          # and so stale timestamp-versioned .pkg files don't accumulate on the release:
          #   1. upload the packages first
          #   2. upload the catalog LAST (so it only ever references packages already present)
          #   3. prune any package asset that isn't part of this snapshot
          # Packages are every .pkg in out/repo except the catalogue's own
          # packagesite.pkg and data.pkg: the NextBSD-* packages and pkg itself.
          keep=$(cd out/repo && ls *.pkg | grep -vxE 'packagesite\.pkg|data\.pkg')
          echo "== 1. upload packages =="
          gh release upload "$TAG" -R "$R" $(printf 'out/repo/%s ' $keep) --clobber
          echo "== 2. upload catalog (last) =="
          gh release upload "$TAG" -R "$R" out/repo/meta* out/repo/packagesite* out/repo/data* --clobber
          echo "== 3. prune stale package assets =="
          for a in $(gh release view "$TAG" -R "$R" --json assets -q '.assets[].name' | grep -E '\.pkg$' | grep -vxE 'packagesite\.pkg|data\.pkg'); do
            if printf '%s\n' "$keep" | grep -qx "$a"; then
              :
            else
              echo "  prune: $a"
              gh release delete-asset "$TAG" "$a" -R "$R" --yes
            fi
          done
          echo "Published (${{ matrix.arch }}) — release assets now:"
          gh release view "$TAG" -R "$R" --json assets -q '.assets[].name' | sort

  verify:
    name: verify (${{ matrix.arch }})
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: pkg update + resolve NextBSD-everything (FreeBSD VM)
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg bootstrap -y || true
          run: |
            ARCH=${{ matrix.arch }} sh scripts/verify.sh
